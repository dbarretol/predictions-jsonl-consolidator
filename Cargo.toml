[package]
name = "predictions-jsonl-consolidator"
version = "0.1.0"
edition = "2024"
description = "Consolida, deduplica y exporta (TXT/Markdown/CSV) archivos JSONL de predicciones"
authors = ["dbarretol <57958754+dbarretol@users.noreply.github.com>"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
csv = "1.1"
chrono = "0.4"
fxhash = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.10"
natord = "1.0.9"
thiserror = "2.0.19"
walkdir = "2.5.0"
